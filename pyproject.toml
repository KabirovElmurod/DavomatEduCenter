[project]
name = "education-center"
version = "0.1.0"
description = "Davomat tizimi - Education Center attendance system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.12.1",
    "aiogram>=3.3.0",
    "arq>=0.26.0",
    "redis>=5.0.1",
    "orjson>=3.9.10",
    "structlog>=23.2.0",
    "python-jose[cryptography]>=3.3.0",
    "tzdata>=2024.1",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=41.0.7",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "qrcode>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.19.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
